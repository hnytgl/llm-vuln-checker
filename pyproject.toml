[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-vuln-checker"
version = "0.1.0"
description = "A defensive CLI for checking common LLM application security weaknesses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hnytgl" }]
keywords = ["llm", "security", "prompt-injection", "red-team", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
llm-vuln-checker = "llm_vuln_checker.cli:main"

[tool.setuptools.package-data]
llm_vuln_checker = ["rules.json"]
